name: Production Runtime Smoke

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/runtime-smoke.yml'
  push:
    branches: ['perf/laravel-production-runtime']
    paths:
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/runtime-smoke.yml'

jobs:
  docker-runtime-smoke:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t awj-api-runtime-smoke .

      - name: Verify Apache configuration
        run: |
          set -euo pipefail
          docker run --rm --entrypoint apache2ctl awj-api-runtime-smoke -t
          loaded_mpm_count="$(docker run --rm --entrypoint sh awj-api-runtime-smoke -lc "apache2ctl -M 2>/dev/null | grep -Ec 'mpm_.*_module'")"
          test "$loaded_mpm_count" -eq 1
          docker run --rm --entrypoint sh awj-api-runtime-smoke -lc "apache2ctl -M 2>/dev/null | grep -q 'mpm_prefork_module'"

      - name: Start production container
        run: |
          docker run -d --name awj-api-smoke \
            -p 18080:18080 \
            -e PORT=18080 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/awj-runtime-smoke.sqlite \
            awj-api-runtime-smoke

      - name: Wait for health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' awj-api-smoke | grep -qx true; then
              echo 'Container exited before becoming healthy.'
              docker logs awj-api-smoke
              exit 1
            fi
            sleep 2
          done
          echo 'Health endpoint did not become ready in time.'
          docker logs awj-api-smoke
          exit 1

      - name: Verify Apache runtime
        run: |
          set -euo pipefail
          docker exec awj-api-smoke sh -lc 'ps aux | grep -E "[a]pache2"'
          if docker logs awj-api-smoke 2>&1 | grep -q 'php artisan serve'; then
            echo 'Development server unexpectedly detected.'
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs awj-api-smoke || true
