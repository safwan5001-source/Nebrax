name: Production Runtime Smoke

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/runtime-smoke.yml'
  push:
    branches: ['perf/laravel-production-runtime']
    paths:
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/runtime-smoke.yml'

jobs:
  docker-runtime-smoke:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t awj-api-runtime-smoke .

      - name: Verify GD image capabilities
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php awj-api-runtime-smoke -r '
            if (!extension_loaded("gd")) { fwrite(STDERR, "GD extension is not loaded.\n"); exit(1); }
            $info = gd_info();
            foreach (["JPEG Support", "PNG Support", "WebP Support"] as $capability) {
                if (empty($info[$capability])) { fwrite(STDERR, "Missing GD capability: {$capability}\n"); exit(1); }
            }
            echo "GD capabilities verified: JPEG, PNG, WebP\n";
          '

      - name: Verify Apache configuration
        run: |
          set -euo pipefail
          docker run --rm --entrypoint apache2ctl awj-api-runtime-smoke -t
          loaded_mpm_count="$(docker run --rm --entrypoint sh awj-api-runtime-smoke -lc "apache2ctl -M 2>/dev/null | grep -Ec 'mpm_.*_module'")"
          test "$loaded_mpm_count" -eq 1
          docker run --rm --entrypoint sh awj-api-runtime-smoke -lc "apache2ctl -M 2>/dev/null | grep -q 'mpm_prefork_module'"

      - name: Start production container
        run: |
          docker run -d --name awj-api-smoke \
            -p 18080:18080 \
            -e PORT=18080 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/awj-runtime-smoke.sqlite \
            awj-api-runtime-smoke

      - name: Wait for health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' awj-api-smoke | grep -qx true; then
              echo 'Container exited before becoming healthy.'
              docker logs awj-api-smoke
              exit 1
            fi
            sleep 2
          done
          echo 'Health endpoint did not become ready in time.'
          docker logs awj-api-smoke
          exit 1

      - name: Verify Apache runtime
        run: |
          set -euo pipefail
          docker exec awj-api-smoke sh -lc 'ps aux | grep -E "[a]pache2"'
          if docker logs awj-api-smoke 2>&1 | grep -q 'php artisan serve'; then
            echo 'Development server unexpectedly detected.'
            exit 1
          fi

      - name: Verify PHP upload limits (Apache mod_php and CLI)
        run: |
          set -euo pipefail
          # AWJ-UPLOAD-PHP-LIMITS-1: الصورة الرسمية بلا php.ini، وكان الافتراضي 2M/8M يُسقط
          # أي رفع فوق 2MB. نتحقق هنا من السلوك الحقيقي تحت Apache (لا CLI فقط).

          # 1) CLI: ملف الـini محمَّل والقيم مطابقة.
          docker exec awj-api-smoke php --ini | grep -q 'zz-awj-uploads.ini'
          docker exec awj-api-smoke php -r 'echo json_encode(["u"=>ini_get("upload_max_filesize"),"p"=>ini_get("post_max_size"),"m"=>ini_get("memory_limit"),"f"=>ini_get("max_file_uploads")]);' \
            | jq -e '.u=="20M" and .p=="128M" and .m=="256M" and .f=="20"'

          # 2) Apache SAPI: مسبار يُحقن في الحاوية الحية فقط.
          docker cp deploy/php/upload-probe.php awj-api-smoke:/app/public/awj-upload-probe.php
          docker exec awj-api-smoke chmod 644 /app/public/awj-upload-probe.php
          probe() { curl -sS --max-time 180 "$@" http://127.0.0.1:18080/awj-upload-probe.php | tail -n 1; }

          probe | jq -e '.sapi=="apache2handler" and .ini.upload_max_filesize=="20M" and .ini.post_max_size=="128M" and .ini.memory_limit=="256M" and .ini.max_file_uploads=="20" and .ini.file_uploads=="1"'

          mkdir -p /tmp/upl
          head -c $((6 * 1024 * 1024))   /dev/zero > /tmp/upl/6m      # صورة iPhone نموذجية: كانت ترفضها 2M
          head -c $((20 * 1024 * 1024))  /dev/zero > /tmp/upl/20m     # حدّ مركز المستندات (20480KB)
          head -c $((20 * 1024 * 1024 + 1)) /dev/zero > /tmp/upl/20m1 # فوق السقف ببايت
          head -c $((10 * 1024 * 1024))  /dev/zero > /tmp/upl/10m     # أقصى مرفق (10240KB)

          probe -F 'media[]=@/tmp/upl/6m'   | jq -e '.files[0].error==0 and .files[0].size==6291456'
          probe -F 'file=@/tmp/upl/20m'     | jq -e '.files[0].error==0 and .files[0].size==20971520'
          probe -F 'file=@/tmp/upl/20m1'    | jq -e '.files[0].error==1'   # UPLOAD_ERR_INI_SIZE: السقف ما زال مفروضاً

          args=(); for _ in $(seq 1 10); do args+=(-F 'attachments[]=@/tmp/upl/10m'); done
          probe "${args[@]}" | jq -e '(.files|length)==10 and ([.files[].error]|all(.==0))'   # 10×10MiB = 100MiB مرفقات

          args=(); for _ in $(seq 1 13); do args+=(-F 'attachments[]=@/tmp/upl/10m'); done
          probe "${args[@]}" | jq -e '(.files|length)==0'                                       # 130MiB > post_max_size

          docker exec awj-api-smoke rm -f /app/public/awj-upload-probe.php

      - name: Container logs
        if: always()
        run: docker logs awj-api-smoke || true
