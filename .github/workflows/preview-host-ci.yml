name: Preview Host CI

# MOBILE-PREVIEW-10B-2A — خدمة مضيف المعاينة المعزولة (preview-host/).
# اختبارات node:test بلا أي اعتماديات خارجية + بناء صورة Docker وفحص دخان لها.
# لا نشر ولا أسرار هنا: بصمة Android ومعرّف فريق Apple في الدخان قيم اختبارية بحتة.

on:
  push:
    branches: ['**']
    paths: ['preview-host/**', '.github/workflows/preview-host-ci.yml']
  pull_request:
    branches: ['**']
    paths: ['preview-host/**', '.github/workflows/preview-host-ci.yml']

jobs:
  check:
    name: preview-host (test + image smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit + integration tests
        working-directory: preview-host
        run: npm test

      - name: Build image
        run: docker build -t awj-preview-host preview-host

      - name: Image smoke (platform-independent start, fail-closed routes)
        run: |
          set -euo pipefail
          FP=AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99
          wait_ready() {
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:3000/health >/dev/null && return 0
              sleep 1
            done
            return 1
          }
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$1"; }

          # A process-level problem (unusable PORT) must still refuse to start.
          if docker run --rm -e PORT=not-a-port awj-preview-host >/dev/null 2>&1; then
            echo "container started with an invalid PORT" >&2
            exit 1
          fi

          # Android-only: starts, assetlinks 200, AASA fails closed (503).
          docker run -d --name ph -p 3000:3000 -e ANDROID_APP_LINK_SHA256_FINGERPRINTS=$FP awj-preview-host
          wait_ready
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/.well-known/assetlinks.json | grep -q 'com.example.awjmobileruntimeproof'
          test "$(status /.well-known/apple-app-site-association)" = 503
          test "$(status /preview/SmokeReference123)" = 200
          curl -sSI http://127.0.0.1:3000/preview/SmokeReference123 | grep -i '^referrer-policy: no-referrer'
          ! docker logs ph 2>&1 | grep -q SmokeReference123
          docker rm -f ph >/dev/null

          # Both configured: both associations served.
          docker run -d --name ph -p 3000:3000 -e ANDROID_APP_LINK_SHA256_FINGERPRINTS=$FP -e APPLE_TEAM_ID=ABCDE12345 awj-preview-host
          wait_ready
          test "$(status /.well-known/assetlinks.json)" = 200
          curl -fsS http://127.0.0.1:3000/.well-known/apple-app-site-association | grep -q 'ABCDE12345.com.example.awjMobileRuntimeProof'
          docker rm -f ph >/dev/null

          # Nothing configured: still starts, both associations 503.
          docker run -d --name ph -p 3000:3000 awj-preview-host
          wait_ready
          test "$(status /.well-known/assetlinks.json)" = 503
          test "$(status /.well-known/apple-app-site-association)" = 503
