name: EXP PG shards (experiment - NOT part of the CI Gate)

# تجربة معزولة (AWJ_PG_SHARDING_FEASIBILITY): هل يقسم تقسيمٌ ثابت لملفات الاختبار بمانيفست أزمنة مجموعةَ PostgreSQL إلى شريحتين متوازيتين
# دون إسقاط أو تكرار أي اختبار؟  6 تكرارات x شريحتان على SHA ثابت.
#  - تعمل على push إلى الفرع exp/ci-pg-shards فقط. لا pull_request، فلا تدخل CI Gate. لا تمسّ ci.yml ولا required-checks.json ولا أي اختبار.
#  - إعداد PostgreSQL مطابق لـjob الاختبارات الحالي (قرص المشغّل، بلا tmpfs، المتانة الافتراضية: fsync وsynchronous_commit وfull_page_writes لا تُغيَّر).
#  - كل ملفات الاختبار تبقى على القرص في كل شريحة؛ الاختيار بقائمة <file> صريحة في phpunit.xml (لا بأعلام --filter/--group).
#  - fail-fast: أي فشل أو اختلاف غير مفسَّر يوقف التجربة (قرار التجربة).
on:
  push:
    branches: ['exp/ci-pg-shards']

concurrency:
  group: exp-pg-shards-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    name: pgsql shard ${{ matrix.shard }}/2 rep-${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        db: [pgsql]
        shard: [1, 2]
        rep: [1, 2, 3, 4, 5, 6]
    env:
      COMPOSER_NO_INTERACTION: '1'
      APP_DIR: /tmp/nibras-app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nibras
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: nibras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nibras"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout core (النواة)
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pgsql, pdo_pgsql, bcmath, intl, fileinfo, zip, dom, gd
          coverage: none

      - name: التحقق من GD وصيغ الصور وعمليات resize الأساسية
        run: php "$GITHUB_WORKSPACE/tests/Fixtures/gd-runtime-smoke.php"

      - name: تثبيت محركات PDF وXML
        run: |
          # مصدر Google Chrome APT مثبَّت مسبقاً على عدّاد GitHub-hosted ولا علاقة له
          # بالمشروع؛ يفشل أحياناً بـ"Hash Sum mismatch" فيوقف كل خطوة apt-get update.
          # نعطّل ملف مصدره فقط دون المساس بأي مصدر آخر أو كبت أخطاء apt عامة.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils libxml2-utils

      # Laravel 11 دخل الدعم الأمني فقط، فصارت إصداراته تحمل تنبيهات أمنية
      # يحجبها Composer 2.10+ افتراضياً. نعطّل الحجب في بيئة CI المؤقتة فقط.
      - name: السماح بتثبيت Laravel 11 (بيئة CI مؤقتة)
        run: composer config --global policy.advisories.block false

      - name: إنشاء مشروع Laravel 11
        run: composer create-project "laravel/laravel:^11.0" "$APP_DIR" --prefer-dist --no-progress

      - name: تثبيت Sanctum + تخزين S3/R2 + تفعيل مسارات API
        working-directory: ${{ env.APP_DIR }}
        run: |
          # يقرأ «حارس قائمة النسخ» هذا السطر (laravel/sanctum أولاً، سطرٌ واحد) ليطابق حزم setup.sh.
          composer require laravel/sanctum league/flysystem-aws-s3-v3:^3.0 predis/predis:^2.2 resend/resend-php intervention/image-laravel:4.1.1 --quiet
          php "$GITHUB_WORKSPACE/tests/Fixtures/intervention-image-runtime-smoke.php" "$APP_DIR"
          php artisan install:api --no-interaction --quiet || true
          rm -f database/migrations/*_create_personal_access_tokens_table.php


      - name: تثبيت ParaTest (pgsql فقط)
        if: matrix.db == 'pgsql'
        working-directory: ${{ env.APP_DIR }}
        run: composer require --dev "brianium/paratest:^7.4" --quiet

      - name: دمج ملفات النواة وطبقة الـ API
        run: |
          CORE="$GITHUB_WORKSPACE"
          cd "$APP_DIR"
          mkdir -p app/Contracts app/Mail app/Events app/Listeners app/Jobs/Accounting app/Jobs/DocumentCenter app/Services app/Services/Accounting app/Services/Commerce app/Services/Commerce/Edge app/Services/Commerce/Otp app/Services/DocumentCenter app/Services/AppBuilder app/Services/DeliveryHub app/Services/Pos app/Services/Pos/Hardware app/Services/Reporting app/Services/PrintTemplates app/Support app/Support/Inventory app/Support/Dns app/Support/Commerce app/Services/Communications app/Support/Communications \
                   app/Tenancy app/Http/Middleware app/Http/Controllers/Api \
                   app/Http/Requests app/Http/Resources app/Console/Commands \
                   app/Models/Concerns tests/Feature tests/Fixtures/presentation routes config docs/openapi contracts/app-builder contracts/flowers-journey contracts/flowers-admin-journey/responses
          cp -r "$CORE/app/Models/"*.php                  app/Models/
          cp -r "$CORE/app/Mail/"*.php                    app/Mail/ 2>/dev/null || true
          cp -r "$CORE/app/Events/"*.php  app/Events/ 2>/dev/null || true
          cp -r "$CORE/app/Listeners/"*.php  app/Listeners/ 2>/dev/null || true
          cp -r "$CORE/app/Contracts/"*.php                app/Contracts/
          cp -r "$CORE/app/Jobs/DocumentCenter/"*.php      app/Jobs/DocumentCenter/
          cp -r "$CORE/app/Jobs/Accounting/"*.php          app/Jobs/Accounting/
          # المجلدات الفرعية لا يلتقطها الـ glob أعلاه — كل مجلد جديد يُضاف صراحةً
          cp -r "$CORE/app/Models/Concerns/"*.php         app/Models/Concerns/
          cp -r "$CORE/app/Services/"*.php                app/Services/ 2>/dev/null || true
          cp -r "$CORE/app/Services/Accounting/"*.php     app/Services/Accounting/
          cp -r "$CORE/app/Services/Commerce/"*.php       app/Services/Commerce/
          cp -r "$CORE/app/Services/Commerce/Edge/"*.php  app/Services/Commerce/Edge/
          cp -r "$CORE/app/Services/Commerce/Otp/"*.php   app/Services/Commerce/Otp/
          cp -r "$CORE/app/Services/DocumentCenter/"*.php app/Services/DocumentCenter/
          cp -r "$CORE/app/Services/AppBuilder/"*.php     app/Services/AppBuilder/
          cp -r "$CORE/app/Services/DeliveryHub/"*.php    app/Services/DeliveryHub/
          cp -r "$CORE/app/Services/Pos/"*.php            app/Services/Pos/
          cp -r "$CORE/app/Services/Pos/Hardware/"*.php   app/Services/Pos/Hardware/
          cp -r "$CORE/app/Services/Reporting/"*.php      app/Services/Reporting/
          cp -r "$CORE/app/Services/PrintTemplates/"*.php app/Services/PrintTemplates/
          cp -r "$CORE/app/Support/"*.php                 app/Support/
          cp -r "$CORE/app/Support/Inventory/"*.php       app/Support/Inventory/
          cp -r "$CORE/app/Support/Dns/"*.php             app/Support/Dns/
          cp -r "$CORE/app/Support/Commerce/"*.php        app/Support/Commerce/
          cp -r "$CORE/app/Services/Communications/"*.php app/Services/Communications/
          cp -r "$CORE/app/Support/Communications/"*.php  app/Support/Communications/
          cp -r "$CORE/app/Tenancy/"*.php                 app/Tenancy/
          cp -r "$CORE/app/Http/Middleware/"*.php         app/Http/Middleware/
          cp -r "$CORE/app/Http/Controllers/Api/"*.php    app/Http/Controllers/Api/
          cp -r "$CORE/app/Http/Requests/"*.php           app/Http/Requests/
          cp -r "$CORE/app/Http/Resources/"*.php          app/Http/Resources/
          cp -r "$CORE/app/Providers/"*.php               app/Providers/
          cp -r "$CORE/config/"*.php                      config/
          # أوامر artisan (تشخيص/صيانة) — بلا هذا السطر توجد في المستودع ولا تصل الاختبار
          cp -r "$CORE/app/Console/Commands/"*.php       app/Console/Commands/ 2>/dev/null || true
          cp -r "$CORE/database/migrations/"*.php         database/migrations/
          cp -r "$CORE/routes/api.php"                    routes/api.php
          cp -r "$CORE/routes/api_public.php"          routes/api_public.php
          cp -r "$CORE/routes/api_storefront.php"      routes/api_storefront.php
          cp -r "$CORE/routes/api_commerce.php"        routes/api_commerce.php
          cp -r "$CORE/routes/api_preview.php"         routes/api_preview.php
          cp -r "$CORE/routes/console.php"                routes/console.php
          cp -r "$CORE/resources/views/"*                 resources/views/ 2>/dev/null || true
          cp -r "$CORE/tests/Feature/"*.php               tests/Feature/
          cp -r "$CORE/tests/Fixtures/presentation/"*.json tests/Fixtures/presentation/ 2>/dev/null || true
          # عقد OpenAPI (توثيق فقط) — يقرأه اختبار المطابقة عبر base_path('docs/openapi/…')
          cp -r "$CORE/docs/openapi/"*.yaml               docs/openapi/
          # حدود PHP الإنتاجية (AWJ-UPLOAD-PHP-LIMITS-1) — يقرؤها PhpUploadLimitsContractTest وPhpUploadRuntimeTest
          mkdir -p deploy/php
          cp "$CORE/deploy/php/awj-uploads.ini"            deploy/php/
          # عقد LIVE-PREVIEW مشترك (LIVE-PREVIEW-2/7) — يقرأه اختبار الإثبات المتكامل عبر
          # base_path('contracts/app-builder/…')؛ نفس الملفات التي تقرأها اختبارات TypeScript/Dart مباشرة.
          cp -r "$CORE/contracts/app-builder/"*.json      contracts/app-builder/
          # أرشيف النسخ المجمَّد (CPT-05) في مجلد فرعي — يقرؤه PublishedVersionArchiveTest.
          mkdir -p contracts/app-builder/archive
          cp -r "$CORE/contracts/app-builder/archive/"*.json contracts/app-builder/archive/
          # سجل قوالب التطبيقات (AD-11 / S22a) — يقرؤه AppTemplateRegistry عبر resource_path()؛ نفس الملفات يقرؤها اختبار Dart.
          mkdir -p resources/app-builder/templates
          cp -r "$CORE/resources/app-builder/templates/"*.json resources/app-builder/templates/
          # عقد رحلة الورود والهدايا (FLOWERS-H16): استجابات store/v1 الحقيقية؛ يقارنها FlowersEndToEndJourneyTest
          # بالواقع، ويقرؤها اختبار واجهة المتجر بمحلّلاته الفعلية.
          cp -r "$CORE/contracts/flowers-journey/"*.json  contracts/flowers-journey/
          # عقد رحلة التاجر الإدارية (FLOWERS-H2-15): الطلبات تولّدها الواجهة، والاستجابات يلتقطها الخادم؛ يقارنهما FlowersMerchantAdminJourneyTest.
          cp -r "$CORE/contracts/flowers-admin-journey/requests.json" contracts/flowers-admin-journey/
          cp -r "$CORE/contracts/flowers-admin-journey/responses/"*.json contracts/flowers-admin-journey/responses/

      - name: تسجيل TenancyServiceProvider + حذف users migration الافتراضية
        working-directory: ${{ env.APP_DIR }}
        run: |
          grep -q "TenancyServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\TenancyServiceProvider::class,|" bootstrap/providers.php
          grep -q "DocumentCenterServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\DocumentCenterServiceProvider::class,|" bootstrap/providers.php
          grep -q "PublicApiServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\PublicApiServiceProvider::class,|" bootstrap/providers.php
          grep -q "StorefrontApiServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\StorefrontApiServiceProvider::class,|" bootstrap/providers.php
          grep -q "CommerceApiServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\CommerceApiServiceProvider::class,|" bootstrap/providers.php
          grep -q "PreviewApiServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\PreviewApiServiceProvider::class,|" bootstrap/providers.php
          grep -q "WebhookServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\WebhookServiceProvider::class,|" bootstrap/providers.php
          grep -q "MailServiceProvider" bootstrap/providers.php || \
            sed -i "s|return \[|return [\n    App\\\\Providers\\\\MailServiceProvider::class,|" bootstrap/providers.php
          rm -f database/migrations/0001_01_01_000000_create_users_table.php

      - name: رفع حدّ أقفال PostgreSQL للتنفيذ المتوازي (pgsql فقط)
        if: matrix.db == 'pgsql'
        run: |
          set -euo pipefail
          CID="$(docker ps -q --filter ancestor=postgres:16)"
          [ -n "$CID" ] && [ "$(echo "$CID" | wc -l)" -eq 1 ] || { echo "::error::تعذّر تحديد حاوية postgres الوحيدة"; exit 1; }
          docker exec "$CID" psql -U nibras -d nibras -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart "$CID" >/dev/null
          for i in $(seq 1 60); do
            docker exec "$CID" pg_isready -U nibras -d nibras >/dev/null 2>&1 && break
            sleep 1
          done
          LIMIT="$(docker exec "$CID" psql -U nibras -d nibras -Atc "SHOW max_locks_per_transaction")"
          echo "max_locks_per_transaction=$LIMIT"
          [ "$LIMIT" = "1024" ] || { echo "::error::لم يُطبَّق حدّ الأقفال (القيمة: $LIMIT)"; exit 1; }

      - name: تهيئة قاعدة البيانات (${{ matrix.db }})
        working-directory: ${{ env.APP_DIR }}
        run: |
          sed -i "/^DB_HOST=/d;/^DB_PORT=/d;/^DB_DATABASE=/d;/^DB_USERNAME=/d;/^DB_PASSWORD=/d" .env
          if [ "${{ matrix.db }}" = "pgsql" ]; then
            sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|" .env
            printf "DB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=nibras\nDB_USERNAME=nibras\nDB_PASSWORD=secret\n" >> .env
          else
            sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|" .env
            touch database/database.sqlite
          fi
          php artisan migrate:fresh --force

      - name: Shard selection (explicit file list; all test files stay on disk)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/exp-pg-shards/select_shard.py" --root "$APP_DIR" --shard ${{ matrix.shard }} --count 2 \
            --manifest "$GITHUB_WORKSPACE/.github/exp-pg-shards/shards.json" --out-dir "$APP_DIR/shard-out"
          cd "$APP_DIR"
          vendor/bin/phpunit --list-tests 2>/dev/null | grep -cE '^ - ' | tee shard-out/planned_count.txt

      - name: Environment facts
        shell: bash
        run: |
          set -uo pipefail
          CID="$(docker ps -q --filter ancestor=postgres:16 | head -1)"; echo "$CID" > "$RUNNER_TEMP/pgcid"
          {
            echo "runner_name=${{ runner.name }}"; echo "nproc=$(nproc)"; lscpu | grep -E 'Model name|^CPU\(s\)'; free -m | sed -n 1,2p
            for s in fsync synchronous_commit full_page_writes wal_sync_method shared_buffers max_locks_per_transaction; do echo "$s=$(docker exec "$CID" psql -U nibras -d postgres -Atc "SHOW $s")"; done
          } | tee "$APP_DIR/shard-out/env.txt"

      - name: Run shard (current PostgreSQL configuration, 4 workers)
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p shard-out
          export PGOPTIONS="-c lock_timeout=60s"
          PROCS="$(nproc)"; [ "$PROCS" -le 4 ] || PROCS=4
          START=$SECONDS
          php artisan test --parallel --processes="$PROCS" --log-junit shard-out/junit.xml 2>&1 | tee shard-out/output.txt
          echo "$((SECONDS-START))" > shard-out/test_step_s.txt

      - name: Collect isolation evidence and metadata
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          CID="$(cat "$RUNNER_TEMP/pgcid" 2>/dev/null || true)"
          [ -n "$CID" ] && docker exec "$CID" psql -U nibras -d postgres -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'nibras%' ORDER BY 1" > "$APP_DIR/shard-out/dblist.txt" || true
          python3 - <<'PY'
          import json, os, subprocess
          out = os.environ["APP_DIR"] + "/shard-out"
          def rd(p, d=""):
              try: return open(p).read().strip()
              except Exception: return d
          cpu = subprocess.run("lscpu | grep 'Model name' | head -1 | cut -d: -f2", shell=True, capture_output=True, text=True).stdout.strip()
          json.dump({"shard": ${{ matrix.shard }}, "rep": ${{ matrix.rep }}, "nproc": int(subprocess.run("nproc", capture_output=True, text=True).stdout), "cpu": cpu,
                     "test_step_s": int(rd(out + "/test_step_s.txt", "0") or 0), "planned_tests": int(rd(out + "/planned_count.txt", "0") or 0),
                     "runner_name": "${{ runner.name }}", "sha": "${{ github.sha }}"}, open(out + "/meta.json", "w"))
          PY

      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-rep-${{ matrix.rep }}
          path: ${{ env.APP_DIR }}/shard-out/
          retention-days: 14

  prove:
    name: prove exactly-once and compare
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*-rep-*
          path: runs
      # مرجع 1: جرد SQLite الكامل (الضبط التسلسلي، Run 42301504423)؛ مرجع 2: تشغيل PostgreSQL كاملاً بلا تقسيم (Run 42306822942)، على الشجرة نفسها.
      - uses: actions/download-artifact@v4
        with:
          name: exp-serial-1
          path: ref/sqlite
          run-id: 42301504423
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: diag-1
          path: ref/pg
          run-id: 42306822942
          github-token: ${{ github.token }}
      - name: Prove
        run: |
          set -euo pipefail
          git ls-files tests/Feature tests/Unit | grep 'Test\.php$' | sort > runs/tracked_test_files.txt
          python3 .github/exp-pg-shards/prove.py runs ref/sqlite/junit.xml ref/pg/junit.xml .github/exp-pg-shards/shards.json 2 | tee prove-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-report
          path: prove-report.txt
          retention-days: 30
