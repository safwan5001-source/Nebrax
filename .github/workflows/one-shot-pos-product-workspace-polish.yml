name: One-shot POS product workspace polish

on:
  push:
    branches:
      - feat/pos-product-workspace-polish
    paths:
      - .github/workflows/one-shot-pos-product-workspace-polish.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-product-workspace-polish
      - name: Apply focused POS workspace class wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/src/app/(pos)/pos/page.tsx')
          text = path.read_text()
          old_import = "  POS_MOBILE_NAV_CLASS,\n  POS_SALE_GRID_CLASS,\n"
          new_import = "  POS_DESKTOP_CATEGORIES_CLASS,\n  POS_MOBILE_NAV_CLASS,\n  POS_PRODUCTS_PANEL_CLASS,\n  POS_SALE_GRID_CLASS,\n"
          if old_import not in text:
              raise SystemExit('responsive import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_panel = '<section className="flex min-h-0 flex-col gap-3 overflow-y-auto p-3 sm:p-4 lg:p-5">'
          if old_panel not in text:
              raise SystemExit('products panel anchor not found')
          text = text.replace(old_panel, '<section className={POS_PRODUCTS_PANEL_CLASS}>', 1)
          old_cats = '<aside className="hidden flex-col gap-2 overflow-y-auto border-s border-border bg-surface p-3 lg:flex">'
          if old_cats not in text:
              raise SystemExit('desktop categories anchor not found')
          text = text.replace(old_cats, '<aside className={POS_DESKTOP_CATEGORIES_CLASS}>', 1)
          path.write_text(text)
          PY
      - name: Commit focused wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'web/src/app/(pos)/pos/page.tsx'
          git commit -m 'refactor(pos): apply compact product workspace spacing'
          git push
