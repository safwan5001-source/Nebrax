name: One-shot POS remove tax prop

on:
  push:
    branches:
      - feat/pos-product-grid-polish
    paths:
      - .github/workflows/one-shot-pos-remove-tax-prop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-product-grid-polish
      - name: Remove obsolete tax prop from product tile call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/app/(pos)/pos/page.tsx')
          text = path.read_text()
          old = "              taxLabel={taxInclusive ? tprod('tax_incl_tag') : tprod('tax_excl_tag')}\n"
          if old not in text:
              raise SystemExit('obsolete taxLabel call not found')
          path.write_text(text.replace(old, '', 1))
          PY
          git rm .github/workflows/one-shot-pos-remove-tax-prop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'web/src/app/(pos)/pos/page.tsx'
          git commit -m 'refactor(pos): remove product tile tax prop'
          git push origin HEAD:feat/pos-product-grid-polish
