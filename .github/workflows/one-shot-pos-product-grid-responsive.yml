name: One-shot POS product grid responsive

on:
  push:
    branches:
      - feat/pos-product-grid-responsive

permissions:
  contents: write

jobs:
  wire-product-grid:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-product-grid-responsive
          fetch-depth: 0

      - name: Wire responsive product grid helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/app/(pos)/pos/page.tsx')
          text = path.read_text()

          old_import = "  posCartPaneClass,\n  posProductGridPadClass,\n  posProductsPaneClass,"
          new_import = "  posCartPaneClass,\n  posProductGridClass,\n  posProductGridPadClass,\n  posProductsPaneClass,"
          if old_import not in text:
              raise SystemExit('expected pos-responsive import block not found')
          text = text.replace(old_import, new_import, 1)

          old_grid = "className={'grid gap-3 outline-none ' + (posCfg.show_product_images ? 'grid-cols-2 sm:grid-cols-3 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5' : 'grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6') + posProductGridPadClass(count > 0)}"
          new_grid = "className={posProductGridClass(posCfg.show_product_images, count > 0)}"
          if old_grid not in text:
              raise SystemExit('expected product grid class expression not found')
          text = text.replace(old_grid, new_grid, 1)

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/one-shot-pos-product-grid-responsive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'web/src/app/(pos)/pos/page.tsx'
          git commit -m 'refactor(pos): wire adaptive product grid'
          git push origin HEAD:feat/pos-product-grid-responsive
