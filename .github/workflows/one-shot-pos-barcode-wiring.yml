name: One-shot POS barcode wiring

on:
  push:
    branches:
      - feat/pos-product-grid-polish
    paths:
      - .github/workflows/one-shot-pos-barcode-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-product-grid-polish
      - name: Wire real barcode into POS product tile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/app/(pos)/pos/page.tsx')
          text = path.read_text()
          old = """                sku: p.sku,\n                sale_price_label: formatRiyal(p.sale_price),"""
          new = """                sku: p.sku,\n                barcode: p.barcode,\n                sale_price_label: formatRiyal(p.sale_price),"""
          if old not in text:
              raise SystemExit('POS product tile mapping target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/one-shot-pos-barcode-wiring.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'web/src/app/(pos)/pos/page.tsx'
          git commit -m 'refactor(pos): wire product barcode into tile'
          git push origin HEAD:feat/pos-product-grid-polish
