name: Storefront CI

on:
  push:
    branches: ['**']
    paths: ['storefront/**', '.github/workflows/storefront-ci.yml']
  pull_request:
    branches: ['**']
    paths: ['storefront/**', '.github/workflows/storefront-ci.yml']

jobs:
  check:
    name: storefront (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('storefront/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm check

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
