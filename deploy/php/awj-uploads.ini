; ════════════════════════════════════════════════════════════════
;  أَوْج AWJ — حدود الرفع في PHP (AWJ-UPLOAD-PHP-LIMITS-1)
;  يُنسخ إلى /usr/local/etc/php/conf.d/ في Dockerfile فيقرؤه mod_php (Apache)
;  وCLI معاً. الاسم zz-* يضمن التحميل بعد ملفات docker-php-ext-*.
;
;  هذا الملف لا يوسّع ما يقبله أي مسار: حدود كل وحدة (النوع/الحجم/العدد)
;  تبقى في FormRequests وconfig. هنا فقط سقف الطبقة الأدنى كي لا يرفض PHP
;  ملفاً يسمح به التطبيق (كان الافتراضي 2M يُنتج "The media.0 failed to upload.").
;
;  اشتقاق القيم من الحدود الفعلية (يحرسه tests/Feature/PhpUploadLimitsContractTest):
;    أكبر ملف منفرد   : 20480KB  مركز المستندات (config/document_center.php)
;    أكبر طلب متعدد   : 10 × 10240KB = 100MiB  مرفقات (مصروف/دفعة/مشتريات/ملاحظة/موظف)
;    صور المنتج       : 8 × 5120KB  = 40MiB
;    مكتبة المتجر     : 8 × 5MiB    = 40MiB (الواجهة ترسل ملفاً لكل طلب)
;  ⇒ upload_max_filesize ≥ 20M · post_max_size ≥ 100MiB + هامش multipart + الحقول.
;  أي تغيير في حدّ تطبيقي يوجب مراجعة هذا الملف (الاختبار يفشل عند الانحراف).
; ════════════════════════════════════════════════════════════════
file_uploads = On
upload_max_filesize = 20M
post_max_size = 128M
max_file_uploads = 20
memory_limit = 256M
