:root{
  --sh-bg:#e9edf2;--sh-fg:#142238;--sh-muted:#586576;--sh-line:#d3dae3;--sh-chip:#ffffff;--sh-chip-on:#142238;--sh-chip-on-fg:#ffffff;--sh-warn:#8f4d08;--sh-warn-bg:#fdf1e3;

/* ───────── Station app identity (mirrors web/src/modules/station-ops/fuel-ops.css) ───────── */
.app-station{--navy:#142238;--accent:#e87722;--on-navy:#fff;--on-navy-muted:#b9c7d6;--navy-line:#2a3b56;--cta-bg:#e87722;--cta-fg:#142238;

:root[data-theme="dark"] .app-station{--navy:#0a121e;--accent:#f08a3c;--navy-line:#22324a;--cta-bg:#f08a3c;--bg:#0d1624;--surface:#142238;--text:#eef2f7;--muted:#a6b3c5;--border:#2a3b56;--primary:#f4a15a;--primary-hover:#f7b57b;--primary-soft:#3a2a1c;--positive:#4cc9a8;--negative:#ff8a94;--warning:#f2b068;--control:#7388a6;--pos-tint:#12372f;--warn-tint:#3a2a1c;--neg-tint:#3d1f26;--shadow:0 5px 18px rgb(0 0 0/.35)}

.app-erp{--bg:#f6f7f9;--surface:#fff;--text:#15181d;--muted:#6b7280;--border:#eceef1;--primary:#1e40af;--primary-hover:#1e3a8a;--primary-soft:#eef2ff;--primary-fg:#fff;
  --positive:#166534;--negative:#b91c1c;--warning:#92400e;--control:#aab2bf;--pos-tint:#e9f6ee;--warn-tint:#fdf1e3;--neg-tint:#fbeaea;--r:8px;--r-sm:6px;--tap:36px}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sh-bg);color:var(--sh-fg);font-family:var(--sans);font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary,var(--sh-fg));outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* ───────── Prototype bar (neutral, not part of either product) ───────── */
.bar{flex:none;border-bottom:1px solid var(--sh-line);background:var(--sh-bg)}
.bar-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.seg{display:inline-flex;border:1px solid var(--sh-line);border-radius:999px;background:var(--sh-chip);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;min-height:34px;color:var(--sh-muted)}
.seg button[aria-pressed="true"]{background:var(--sh-chip-on);color:var(--sh-chip-on-fg)}
.bar-tools{display:flex;gap:6px;align-items:center}
.ibtn{border:1px solid var(--sh-line);background:var(--sh-chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.fixture{font-size:12px;color:var(--sh-warn);background:var(--sh-warn-bg);padding:4px 10px;border-radius:999px;font-weight:600}
.stage{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}

/* ───────── Phone frame (desktop only; on a phone the app is the screen) ───────── */
.phone{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:760px){.stage.is-station{align-items:center;padding-block:14px}.phone{width:390px;height:min(844px,100%);border-radius:38px;border:8px solid #0b121c;box-shadow:0 24px 60px rgb(0 0 0/.25)}}

.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);position:relative;width:100%}
.app-erp{font-size:14px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.hide{display:none!important}

/* shared controls (each identity re-skins through tokens) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--control);background:var(--surface);color:var(--text);border-radius:var(--r-sm);min-height:var(--tap);padding:0 16px;font-weight:600;font-size:15px;text-decoration:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg,#fff)}
.app-station .btn.primary{background:var(--cta-bg);border-color:var(--cta-bg);color:var(--cta-fg);min-height:56px;font-size:17px;font-weight:700;border-radius:var(--r)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.danger{border-color:var(--negative);color:var(--negative)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.app-station .btn.sm{min-height:44px;font-size:14px}
.btn.block{width:100%}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.pos{background:var(--pos-tint);color:var(--positive)}.badge.warn{background:var(--warn-tint);color:var(--warning)}.badge.neg{background:var(--neg-tint);color:var(--negative)}.badge.neu{background:var(--primary-soft);color:var(--primary)}.badge.mut{border:1px solid var(--border);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--text)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--negative);font-weight:600}
.inp{width:100%;min-height:var(--tap);border:1px solid var(--control);border-radius:var(--r-sm);background:var(--surface);color:var(--text);padding:0 12px;font-size:16px}
textarea.inp{min-height:84px;padding:10px 12px}
.inp.bad{border-color:var(--negative)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.app-station .card{box-shadow:var(--shadow);border-color:var(--border)}
.pad{padding:16px}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:13px;background:var(--primary-soft);color:var(--text)}
.note.warn{background:var(--warn-tint)}.note.neg{background:var(--neg-tint)}.note.pos{background:var(--pos-tint)}

/* prototype annotations: what is real vs designed */
.tag{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px dashed var(--control);color:var(--muted);white-space:nowrap}
.tag.real{border-style:solid;border-color:var(--positive);color:var(--positive)}
.tag.dec{border-color:var(--warning);color:var(--warning)}
.annot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-block:4px}
.sheet{position:absolute;inset:0;background:rgb(10 18 30/.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet-in{background:var(--surface);color:var(--text);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px))}
.app-erp .sheet{align-items:center}.app-erp .sheet-in{max-width:560px;border-radius:var(--r);max-height:88%}
.toast{position:absolute;inset-inline:16px;bottom:84px;background:var(--text);color:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-weight:600;z-index:50;box-shadow:var(--shadow)}
.app-erp .toast{bottom:20px;inset-inline:auto 20px;max-width:360px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
<style>

<script>
/* ═══════ Tanker Owners — interactive UX prototype ═══════
   PROTOTYPE ONLY: all data below is fictional and lives in memory. Nothing here calls an API,
   moves stock, posts an entry or touches a tenant. Money values are illustrative. */
const TODAY='2026-11-09';
const SHIFT_ID='SH-20261109-1',OLD_SHIFT='SH-20261103-1';
const S={app:'station',lang:'ar',theme:'auto',sim:'ok',tags:true,about:false,tools:false,role:'seller',pol:{tankerRequired:false},
  st:{tab:'home',view:null,wiz:null,sel:null,fFilter:'shift',saving:false,checking:false,shift:{state:'open',close:{},confirm:false,note:'',noteErr:false,review:null,revSheet:false,rnote:'',rnoteErr:false,closedNote:''},flash:null,okNote:null},
  erp:{page:'owners',oid:null,tab:'overview',q:'',status:'all',dlg:null,settle:{},toast:null,lq:''}};

/* i18n: every string is written as an (ar,en) pair at the call site; a missing English string renders as ⟦…⟧ so tests can detect it */
const X=(a,e)=>{const v=S.lang==='ar'?a:e;return v==null?'⟦'+a+'⟧':v};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR_D='٠١٢٣٤٥٦٧٨٩',FA_D='۰۱۲۳۴۵۶۷۸۹';
const normD=s=>String(s).replace(/[٠-٩]/g,d=>AR_D.indexOf(d)).replace(/[۰-۹]/g,d=>FA_D.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',');
const fmt=(n,d=0)=>new Intl.NumberFormat('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const LIT=n=>`<span class="num ltr">${fmt(n,Number.isInteger(n)?0:1)}</span> ${X('لتر','L')}`;
const SAR=(n,d=2)=>`<span class="num ltr">${fmt(n,d)} ⃁</span>`;
const LTR=s=>`<span class="ltr num">${esc(s)}</span>`;
const MON={ar:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
const dstr=(s,time)=>{const [d,t]=String(s).split(' ');const [y,m,dd]=d.split('-').map(Number);const base=`${dd} ${MON[S.lang][m-1]} ${y}`;return time&&t?`${base} · ${t}`:base};
const nm=o=>S.lang==='ar'?o.name[0]:o.name[1];
const tg=k=>({real:`<span class="tag tag-inline real">✓ ${X('موجود في النظام','Exists in system')}</span>`,local:`<span class="tag tag-inline local">${X('مبني محليًا — غير مدموج','Built locally — not merged')}</span>`,proto:`<span class="tag tag-inline">${X('تصميم فقط','Design only')}</span>`,dec:`<span class="tag tag-inline dec">${X('قرار مفتوح','Open decision')}</span>`})[k];

/* ───── icons ───── */
const IC={back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8M6 19.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17 19.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>',clip:'<path d="M9 4h6l1 2h3v15H5V6h3zM9 12h6M9 16h4"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/>',file:'<path d="M7 3h7l4 4v14H7zM14 3v4h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',alert:'<path d="M12 4l10 17H2zM12 10v5M12 18v.5"/>',print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/>',search:'<path d="M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',info:'<path d="M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v6M12 7.5v.5"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'};
const ico=(k,s=20)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ───── fictional master data (names are samples, phones are 05000000xx) ───── */
const PRICE=1.5; // illustrative SAR/L — the real pricing source is an OPEN DECISION (D-A3)
const OWN=[
  {id:'o1',name:['عسكر (مثال)','Askar (sample)'],phone:'0500000001',status:'active',note:''},
  {id:'o2',name:['سلطان (مثال)','Sultan (sample)'],phone:'0500000002',status:'active',note:''},
  {id:'o3',name:['ماجد (مثال)','Majed (sample)'],phone:'0500000003',status:'inactive',note:''},
  {id:'o4',name:['نايف (مثال)','Naif (sample)'],phone:'0500000004',status:'active',note:''}];
const TNK=[
  {id:'t1',oid:'o1',plate:'TNK-1001',cap:20000,active:true},
  {id:'t2',oid:'o1',plate:'TNK-1002',cap:12000,active:true},
  {id:'t3',oid:'o2',plate:'TNK-2001',cap:30000,active:true},
  {id:'t9',oid:'org',plate:'ORG-0001',cap:10000,active:true}];
const CO=[{id:'c1',name:['كيفير (مثال)','Kefir (sample)']},{id:'c2',name:['شركة الندى (مثال)','Nada Co. (sample)']},{id:'c3',name:['مؤسسة الواحة (مثال)','Oasis Est. (sample)']},{id:'c4',name:['شركة الريان (مثال)','Rayyan Co. (sample)']}];
const LNK=[
  {id:'l1',oid:'o1',cid:'c1',from:'2026-01-01',to:null},
  {id:'l2',oid:'o1',cid:'c2',from:'2026-06-01',to:null},
  {id:'l3',oid:'o1',cid:'c3',from:'2026-01-01',to:'2026-05-31'},
  {id:'l4',oid:'o2',cid:'c3',from:'2026-06-01',to:null}];
const PROD={d:['ديزل','Diesel'],g:['بنزين 91','Gasoline 91']};
/* nozzle permissions per operation type come from station settings (prototype: editable on the ERP "Fill settings" page) */
const NOZ=[{id:'p1-1',pump:1,n:1,prod:'d',open:125430.0,ops:['direct','tanker','internal']},{id:'p1-2',pump:1,n:2,prod:'g',open:88120.5,ops:['direct','internal']},{id:'p2-1',pump:2,n:1,prod:'d',open:240115.0,ops:['direct','tanker']},{id:'p2-2',pump:2,n:2,prod:'d',open:97660.0,ops:['direct','internal']}];
const OPN={direct:['مبيعات مباشرة','Direct sales'],tanker:['تعبئة صهاريج المتعاملين','Customer tanker fills'],internal:['صرف داخلي للمؤسسة','Internal issue']};
const opName=k=>OPN[k][S.lang==='ar'?0:1];
const DIRECT={'p1-1':1200,'p1-2':1200,'p2-1':3500,'p2-2':850},DIRECT_N=14,COLL_N=2; // existing direct sales / collections of the current shift (fictional)
const nozLabel=z=>X(`مضخة ${z.pump} · فوهة ${z.n}`,`Pump ${z.pump} · Nozzle ${z.n}`);
const nozById=id=>NOZ.find(z=>z.id===id);
const SAMPLE_ATT=(n,at)=>({name:n,sample:true,by:['موظف تجريبي','Demo employee'],at});
const FILLS=[
  {id:'f3',no:'TF-000123',kind:'tanker',oid:'o2',tid:'t3',nz:'p2-1',l:12000,paper:'7710',at:'2026-11-09 09:05',att:SAMPLE_ATT('voucher-7710.jpg','2026-11-09 09:06')},
  {id:'f2',no:'TF-000122',kind:'tanker',oid:'o1',tid:null,nz:'p1-1',l:3000,paper:'4053',at:'2026-11-09 11:15',att:null},
  {id:'f1',no:'TF-000121',kind:'tanker',oid:'o1',tid:'t1',nz:'p1-1',l:2000,paper:'4052',at:'2026-11-09 07:40',att:SAMPLE_ATT('voucher-4052.jpg','2026-11-09 07:42')},
  {id:'f4',no:'TF-000120',kind:'internal',oid:'org',tid:'t9',nz:'p2-2',l:500,paper:'INT-17',at:'2026-11-09 06:50',att:null},
  {id:'f0',no:'TF-000118',kind:'tanker',oid:'o1',tid:'t2',nz:'p1-1',l:5000,paper:'4049',at:'2026-11-03 14:20',att:SAMPLE_ATT('voucher-4049.jpg','2026-11-03 14:22')}
].sort((a,b)=>b.at.localeCompare(a.at));
const SUP=[
  {id:'s1',oid:'o1',cid:'c1',l:7000,date:'2026-11-04',inv:'INV-2031',total:20000,paid:20000},
  {id:'s2',oid:'o1',cid:'c2',l:2000,date:'2026-11-06',inv:'INV-2044',total:3000,paid:2500},
  {id:'s3',oid:'o2',cid:'c3',l:12000,date:'2026-11-09',inv:null,total:0,paid:0,sales:null}];
const COL=[
  {id:'PAY-3011',inv:'INV-2031',cid:'c1',amt:8000,date:'2026-11-05',oid:'o1'},
  {id:'PAY-3017',inv:'INV-2031',cid:'c1',amt:12000,date:'2026-11-08',oid:'o1'},
  {id:'PAY-3020',inv:'INV-2044',cid:'c2',amt:2500,date:'2026-11-08',oid:null}];
const COMM={o4:{mode:'auto',pct:5,manual:0,reason:''},o1:{mode:'auto',pct:5,manual:0,reason:''},o2:{mode:'auto',pct:5,manual:0,reason:''},o3:{mode:'none',pct:0,manual:0,reason:''}};
const coName=id=>nm(CO.find(c=>c.id===id));
const ownById=id=>OWN.find(o=>o.id===id);
const tnkById=id=>TNK.find(t=>t.id===id);
const tankLabel=id=>id?esc(tnkById(id).plate):X('بدون صهريج','No tanker');
const shOf=f=>f.at.startsWith(TODAY)?SHIFT_ID:OLD_SHIFT;
const todayFills=(nz,kind)=>FILLS.filter(f=>f.at.startsWith(TODAY)&&(!nz||f.nz===nz)&&(!kind||f.kind===kind));
function recorded(nz){const direct=DIRECT[nz]||0,tanker=todayFills(nz,'tanker').reduce((a,f)=>a+f.l,0),internal=todayFills(nz,'internal').reduce((a,f)=>a+f.l,0);return {direct,tanker,internal,total:direct+tanker+internal}}
const ownName=id=>id==='org'?X('المؤسسة (صرف داخلي)','Organization (internal)'):nm(ownById(id));
const monthFills=oid=>FILLS.filter(f=>f.oid===oid&&f.at.startsWith('2026-11'));
function calc(oid){
  const st0=S.erp.settle[oid],snap=S.erp.snap&&S.erp.snap[oid];
  if(st0&&st0!=='draft'&&snap){const paid=st0==='paid'?snap.net:0;return {...snap,paid,due:snap.net-paid}}
  const liters=monthFills(oid).reduce((a,f)=>a+f.l,0);
  const withdrawals=liters*PRICE;
  const coll=COL.filter(c=>c.oid===oid).reduce((a,c)=>a+c.amt,0);
  const pend=COL.filter(c=>c.oid===null&&LNK.some(l=>l.oid===oid&&l.cid===c.cid&&!l.to)).reduce((a,c)=>a+c.amt,0);
  const cm=COMM[oid]||{mode:'none',pct:0,manual:0};
  const commission=cm.mode==='auto'?coll*cm.pct/100:cm.mode==='manual'?Number(cm.manual)||0:0;
  const paid=(S.erp.settle[oid]==='paid')?(coll-withdrawals-commission):0;
  const net=coll-withdrawals-commission;
  return {liters,withdrawals,coll,pend,commission,net,paid,due:net-paid,opening:0,adj:0};
}
const supBal=oid=>{const out=FILLS.filter(f=>f.oid===oid&&f.at.startsWith('2026-11')).reduce((a,f)=>a+f.l,0);const dist=SUP.filter(s=>s.oid===oid).reduce((a,s)=>a+s.l,0);return {out,dist,rest:out-dist}};

/* ═══════ Station app (identity: navy + orange, bottom nav, 52px+ touch targets) ═══════
   Approved operational decisions reflected here:
   • ONE unified shift covers direct sales, tanker fills, internal issue and collections — there is no tanker shift.
   • Meter reconciliation is per nozzle over ALL recorded operations; differences are shown, never settled automatically.
   • Tanker-owner is mandatory for customer-tanker fills; the tanker (vehicle) is optional by default and can be made mandatory in station settings;
     an owner without a registered vehicle is never blocked; the record is kept on the owner's account either way. */
const newWiz=(keep)=>Object.assign({step:1,mode:'owner',oq:'',owner:null,tanker:null,prod:'d',noz:null,liters:'',paper:'',file:null,ack:false,errs:{},out:null,committed:null,replayed:false},keep||{});
const stTop=(title,back,sub)=>`<header class="st-top"><div class="row">${back?`<button class="st-ib flip" data-act="st-back" aria-label="${X('رجوع','Back')}">${ico('back')}</button>`:''}<div class="grow"><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div></div></header>`;
const skel=n=>Array.from({length:n},()=>'<div class="skel"></div>').join('');
const P=()=>S.lang==='ar'?0:1;
function stState(okFn){
  if(S.sim==='loading')return `<div class="st-body" aria-busy="true">${skel(4)}</div>`;
  if(S.sim==='error')return `<div class="st-body"><div class="note neg"><b>${X('تعذّر تحميل البيانات','Could not load data')}</b><p>${X('تحقق من الاتصال ثم أعد المحاولة.','Check your connection and retry.')}</p></div><button class="btn block" data-act="sim-ok">${X('إعادة المحاولة','Retry')}</button></div>`;
  if(S.sim==='empty')return `<div class="st-body"><div class="empty">${ico('clip',36)}<b>${X('لا توجد عمليات بعد','No operations yet')}</b><span>${X('ابدأ بتسجيل أول عملية.','Start by recording the first operation.')}</span></div></div>`;
  return okFn();
}
function stNav(){
  const it=[['home','home',X('الرئيسية','Home')],['fills','truck',X('تعبئات الصهاريج','Tanker fills')],['shift','clip',X('الوردية','Shift')]];
  return `<nav class="st-nav" aria-label="${X('التنقل','Navigation')}">${it.map(([k,i,l])=>`<button data-act="st-tab" data-id="${k}" ${S.st.tab===k&&!S.st.view?'aria-current="page"':''}>${ico(i,24)}<span>${l}</span></button>`).join('')}</nav>`;
}
function stScreen(){
  const s=S.st;let top='',body='',foot='',nav=true;
  if(s.view==='wizard'){nav=false;({top,body,foot}=wizScreen(s.wiz))}
  else if(s.view==='success'){nav=false;top=stTop(X('تم حفظ العملية','Operation saved'),false);body=successBody()}
  else if(s.view==='detail'){top=stTop(X('تفاصيل العملية','Operation details'),true);body=detailBody()}
  else if(s.tab==='home'){top=homeTop();body=homeBody()}
  else if(s.tab==='fills'){top=stTop(X('تعبئات الصهاريج','Tanker fills'),false,X('ضمن الوردية الموحّدة','Part of the unified shift'));body=fillsBody()}
  else {top=stTop(X('الوردية','Shift'),false,X('كل عمليات المحطة في وردية واحدة','All station operations in one shift'));body=shiftBody()}
  return `<div class="app app-station">${top}<div class="scroll" id="stScroll">${body}</div>${foot||''}${nav?stNav():''}${s.saving||s.checking?`<div class="ov" role="status"><span class="spin" style="width:34px;height:34px;border-width:3px"></span><div>${s.checking?X('جارٍ التحقق من الحالة…','Checking status…'):X('جارٍ الحفظ…','Saving…')}</div></div>`:''}${s.flash?`<div class="toast" role="status">${esc(s.flash)}</div>`:''}${s.view===null&&s.tab==='shift'?shiftSheet():''}</div>`;
}
/* ── home: one shift, all operations ── */
function homeTop(){return `<header class="st-top"><div class="row between"><div><div class="sub">${X('مرحبًا','Welcome')}</div><h1>${X('موظف تجريبي','Demo employee')}</h1></div><span class="st-chip">${X('محطة الدمام — تجريبية','Dammam Station — demo')}</span></div></header>`}
function opRow(label,n,l,badge){return `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="grow"><div style="font-weight:600">${label}</div><div class="muted" style="font-size:12px">${badge}</div></div><div style="text-align:end"><b class="num">${n}</b> <span class="muted">${X('عملية','ops')}</span>${l==null?'':`<div class="muted">${LTR(fmt(l))} ${X('لتر','L')}</div>`}</div></div>`}
function homeBody(){
  const closed=S.st.shift.state==='closed',tf=todayFills(null,'tanker'),inf=todayFills(null,'internal'),dl=Object.values(DIRECT).reduce((a,b)=>a+b,0);
  const rv=S.st.shift.review;
  return `<div class="st-body">
   <div class="card pad stack"><div class="row between"><b>${X('الوردية الحالية','Current shift')} <span class="ltr num muted" style="font-size:12px">${SHIFT_ID}</span></b><span class="badge ${closed?'mut':'pos'}">${closed?X('أُغلقت','Closed'):X('مفتوحة منذ 06:00','Open since 06:00')}</span></div>
     <div>${opRow(opName('direct'),DIRECT_N,dl,X('موجود في التطبيق','Exists in the app'))}${opRow(opName('tanker'),tf.length,tf.reduce((a,f)=>a+f.l,0),X('جديد — تصميم','New — design'))}${opRow(opName('internal'),inf.length,inf.reduce((a,f)=>a+f.l,0),X('جديد — تصميم','New — design'))}${opRow(X('التحصيلات','Collections'),COLL_N,null,X('موجود في التطبيق','Exists in the app'))}</div>
     ${closed&&rv==='pending'?`<div class="note warn">${X('بانتظار مراجعة المشرف لفروق العدادات.','Waiting for the supervisor to review meter differences.')}</div>`:''}

   <button class="btn primary block" data-act="wiz-start" ${closed?'disabled':''}>${ico('truck',24)} ${X('تعبئة صهريج جديدة','New tanker fill')}</button>
   ${closed?`<div class="note">${X('الوردية مغلقة — لا يمكن تسجيل عمليات جديدة.','The shift is closed — new operations cannot be recorded.')}</div>`:''}
   <button class="opt" data-act="st-tab" data-id="fills">${ico('clip',24)}<div class="grow"><div class="t">${X('سجل تعبئات الصهاريج','Tanker fills log')}</div><div class="s">${X('السند الورقي والمرفق والصهريج لكل عملية','Paper voucher, attachment and tanker per operation')}</div></div><span class="flip">${ico('chev')}</span></button>
   <button class="opt" data-act="st-tab" data-id="shift">${ico('check',24)}<div class="grow"><div class="t">${X('مطابقة العدادات وإغلاق الوردية','Meter reconciliation & shift close')}</div><div class="s">${X('كل فوهة مقابل كل عملياتها المسجلة','Each nozzle against all its recorded operations')}</div></div><span class="flip">${ico('chev')}</span></button>
  </div>`;
}
/* ── wizard helpers ── */
const wizOp=w=>w.mode==='org'?'internal':'tanker';
const ownerTankers=w=>w.mode==='org'?TNK.filter(t=>t.oid==='org'&&t.active):(w.owner?TNK.filter(t=>t.oid===w.owner&&t.active):[]);
/* the tanker is mandatory only when: customer-tanker fill + station policy says so + the owner actually has registered tankers */
const tankReq=w=>w.mode==='owner'&&S.pol.tankerRequired&&ownerTankers(w).length>0;
const canNext1=w=>w.mode==='org'||(w.owner&&(!tankReq(w)||w.tanker));
const wizTitles=()=>[X('صاحب الصهريج','Tanker owner'),X('المنتج والفوهة','Product & nozzle'),X('الكمية والسند','Quantity & voucher'),X('مراجعة وحفظ','Review & save')];
function wizScreen(w){
  const t=wizTitles();
  const top=`<header class="st-top"><div class="row"><button class="st-ib flip" data-act="wiz-back" aria-label="${X('رجوع','Back')}">${ico('back')}</button><div class="grow"><div class="sub">${X(`الخطوة ${w.step} من 4`,`Step ${w.step} of 4`)}</div><h1>${t[w.step-1]}</h1></div></div><div class="steps" style="margin-top:12px" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=w.step?'on':''}"></i>`).join('')}</div></header>`;
  const body=[wizStep1,wizStep2,wizStep3,wizStep4][w.step-1](w);
  const last=w.step===4,dis=(w.step===1&&!canNext1(w))||(w.step===2&&!w.noz);
  const foot=`<div class="foot">${last?`<button class="btn primary" data-act="wiz-save" ${w.out&&w.out.kind==='unknown'?'disabled':''}>${ico('check',22)} ${X('حفظ التعبئة','Save fill')}</button>`:`<button class="btn primary" data-act="wiz-next" ${dis?'disabled':''}>${X('التالي','Next')}</button>`}</div>`;

}
function ownerListHtml(w){
  const q=normD(w.oq).trim().toLowerCase();
  const list=OWN.filter(o=>!q||nm(o).toLowerCase().includes(q)||o.phone.includes(q));
  if(!list.length)return `<div class="empty"><b>${X('لا نتائج','No results')}</b><span>${X('صاحب الصهريج يُضاف من AWJ ERP وليس من التطبيق.','Tanker owners are added in AWJ ERP, not in this app.')}</span></div>`;
  return list.map(o=>{const n=TNK.filter(t=>t.oid===o.id&&t.active).length,off=o.status!=='active';
    return `<button class="opt" data-act="wiz-owner" data-id="${o.id}" aria-pressed="${w.owner===o.id}" ${off?'disabled':''}><span class="dot">${w.owner===o.id?ico('check',14):''}</span><div class="grow"><div class="t">${esc(nm(o))}</div><div class="s">${off?X('غير نشط','Inactive'):n?X(`${n} صهريج`,`${n} tanker(s)`):X('بلا صهريج مسجّل','No registered tanker')}</div></div></button>`}).join('');
}
function tankPanel(w){

function reconRows(){
  return NOZ.map(z=>{const raw=S.st.shift.close[z.id],cl=pf(raw),rec=recorded(z.id);
    let meter=null,state='wait',diff=null;
    if(cl!=null){if(cl<z.open){state='bad'}else{meter=Math.round((cl-z.open)*10)/10;diff=Math.round((meter-rec.total)*10)/10;state=diff===0?(rec.total===0?'none':'ok'):diff<0?'over':'rem'}}
    return {z,raw,cl,rec,meter,diff,state}});
}
function reconOutHtml(){
  const rows=reconRows();
  const lbl={ok:[X('مطابق','Matches'),'pos'],rem:[X('العداد أكبر من المسجَّل','Meter exceeds recorded'),'warn'],over:[X('المسجَّل أكبر من العداد','Recorded exceeds meter'),'neg'],none:[X('لا عمليات على الفوهة','No operations'),'mut'],wait:[X('بانتظار القراءة','Awaiting reading'),'mut'],bad:[X('قراءة أقل من الافتتاح','Below opening reading'),'neg']};
  const done=rows.filter(r=>r.meter!=null);
  return `<div class="stack">${rows.map(r=>{const [t,c]=lbl[r.state];const cls=r.state==='over'||r.state==='bad'?'over':r.state==='rem'?'rem':r.state==='ok'?'ok':'';
    return `<div class="card rc ${cls}"><div class="row between"><b>${nozLabel(r.z)} · ${prodOf(r.z)}</b><span class="badge ${c}">${t}</span></div>
    <div class="sum3"><div><b class="num ltr">${r.meter==null?'—':fmt(r.meter,1)}</b><span>${X('فرق العداد','Meter delta')}</span></div><div><b class="num ltr">${fmt(r.rec.total)}</b><span>${X('إجمالي المسجَّل','Total recorded')}</span></div><div><b class="num ltr">${r.diff==null?'—':(r.diff>0?'+':'')+fmt(r.diff,1)}</b><span>${X('الفرق','Difference')}</span></div></div>

  const cards=rows.map(r=>`<div class="mcard ${o.act?'clk':''}" ${o.act?`data-act="${o.act}" data-id="${r.id}"`:''}>${cols.map((c,i)=>i===0?`<div class="mc-title">${val(c,r)}</div>`:`<div class="mc-row"><span class="muted">${c.h}</span><span>${val(c,r)}</span></div>`).join('')}</div>`).join('');

  const stage=S.app==='station'?`<div class="stage is-station"><div class="phone">${stScreen()}</div></div>`:`<div class="stage">${erpScreen()}</div>`;
  root.innerHTML=barHtml()+stage+aboutSheet();

}

function wizValidate(n){
  const w=S.st.wiz,e={};
  if(n===1&&!canNext1(w))e.tanker=X('اختر صاحب الصهريج (والصهريج إن كان مطلوبًا).','Choose the tanker owner (and the tanker if required).');
  if(n===2&&!w.noz)e.noz=X('اختر الفوهة للمتابعة.','Select a nozzle to continue.');
  if(n===3){const raw=normD(w.liters).trim(),l=pf(raw);
    if(!raw)e.liters=X('أدخل الكمية.','Enter the quantity.');
    else if(l==null||!/^-?[0-9]+([.,][0-9]+)?$/.test(raw))e.liters=X('أدخل رقمًا صحيحًا.','Enter a valid number.');
    else if(l<0)e.liters=X('الكمية لا يمكن أن تكون سالبة.','The quantity cannot be negative.');
    else if(l===0)e.liters=X('الكمية يجب أن تكون أكبر من صفر.','The quantity must be greater than zero.');
    const p=normD(w.paper).trim();
    if(!p)e.paper=X('أدخل رقم السند الورقي.','Enter the paper voucher number.');
    else{const d=FILLS.find(f=>f.paper===p);if(d)e.paper=X(`رقم السند ${p} مسجّل مسبقًا على العملية ${d.no} (${ownName(d.oid)} — ${dstr(d.at)}). كل سند ورقي يُسجَّل مرة واحدة ضمن نطاق الترقيم؛ تحقق من الرقم أو راجع المشرف.`,`Voucher number ${p} is already recorded on operation ${d.no} (${ownName(d.oid)} — ${dstr(d.at)}). Each paper voucher is recorded once within its numbering scope; check the number or ask a supervisor.`)}
    const t=w.tanker?tnkById(w.tanker):null;if(t&&l>t.cap&&!w.ack)e.ack=X('أكّد صحة الكمية للمتابعة.','Confirm the quantity to continue.')}
  w.errs=e;return !Object.keys(e).length;
}
function commitFill(replayed){

  const n=Math.max(...FILLS.map(f=>Number(f.no.slice(3))))+1,hh=new Date().toTimeString().slice(0,5);
  const f={id:'f'+n,no:'TF-'+String(n).padStart(6,'0'),kind:wizOp(w)==='internal'?'internal':'tanker',oid:w.mode==='org'?'org':w.owner,tid:w.tanker||null,nz:w.noz,l:pf(w.liters),paper:normD(w.paper).trim(),at:TODAY+' '+hh,att:w.file?{name:w.file.name,img:w.file.img,url:w.file.url,by:['موظف تجريبي','Demo employee'],at:TODAY+' '+hh}:null};
  FILLS.unshift(f);w.committed=f.id;w.replayed=!!replayed;
}

  'cm-mode'(b){COMM[S.erp.oid].mode=b.dataset.id;render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||b.getAttribute('aria-disabled')==='true')return;const f=ACTS[b.dataset.act];if(f){if(b.tagName==='A')e.preventDefault();f(b,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr.clk')){e.target.click()}if(e.key==='Escape'){if(S.erp.dlg){S.erp.dlg=null;render()}else if(S.about){S.about=false;render()}}});
render();

</script>
</body></html>
