/* رموز نظام تصميم أَوْج — المصدر: web/src/app/globals.css */
:root{
  --background:#f6f7f9;--surface:#ffffff;--text:#15181d;--muted:#6b7280;--border:#eceef1;
  --primary:#1e40af;--primary-hover:#1e3a8a;--primary-soft:#eef2ff;--primary-fg:#ffffff;
  --positive:#166534;--negative:#b91c1c;--warning:#92400e;
  --field:color-mix(in srgb,var(--muted) 38%,var(--border));
  --font-sans:'IBM Plex Sans Arabic','AWJ Saudi Riyal',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-mono:'IBM Plex Mono','AWJ Saudi Riyal',ui-monospace,monospace;
  --r:8px;--hdr:92px;
}
html.dark{
  --background:#0e1014;--surface:#181b20;--text:#f3f4f6;--muted:#9099a5;--border:#262a31;
  --primary:#4f8cff;--primary-hover:#6ba0ff;--primary-soft:#1b2740;--primary-fg:#0e1014;
  --positive:#16a34a;--negative:#f87171;--warning:#d97706;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);background:var(--background);color:var(--text);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);direction:ltr;unicode-bidi:embed}
bdi{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{flex:none;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{scroll-behavior:auto!important;transition:none!important}}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--field);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--primary-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed;background:var(--surface)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.p:hover{background:var(--primary-hover)}
.btn.p[disabled]{background:var(--primary);opacity:.45}
.btn.g{border-color:transparent;background:transparent}
.btn.g:hover{background:var(--primary-soft)}
.btn.neg{color:var(--negative)}
.btn.ic{width:36px;padding:0}
.btn.lg{min-height:44px;padding:0 20px}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* شارات الحالة: لون + أيقونة + نص */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid;line-height:1.7;white-space:nowrap}
.badge.ready{color:var(--positive);border-color:color-mix(in srgb,var(--positive) 45%,transparent)}
.badge.limited{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 50%,transparent)}
.badge.proposed{color:var(--muted);border:1px dashed var(--muted)}
.badge.decide{color:var(--negative);border-color:color-mix(in srgb,var(--negative) 45%,transparent)}
.badge.neutral{color:var(--muted);border-color:var(--border)}

.proto-strip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:5px 12px;background:var(--primary-soft);border-bottom:1px solid var(--border);font-size:12px;text-align:center}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;min-height:56px}
.top .ttl{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;flex:1 1 0}
.top .ttl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .grp{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;min-height:34px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-fg)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:0 6px;min-height:34px}
.status.clean{color:var(--positive)}.status.dirty{color:var(--warning)}.status.busy{color:var(--muted)}.status.err{color:var(--negative)}
.status .short{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.modebar{display:none}


/* عنوان فرعي مشتق للصف (عرض فقط — لا يُخزَّن في AppSchema) */
.row .sb{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ihead .t small.sb2{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* الافتراضيات المعلنة */
.help.dflt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.help.dflt .badge{font-size:11px;padding:0 6px}

/* اختيار القالب */
.crt .card.wide{max-width:900px}
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tp{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);text-align:start;min-height:0}
.tp:hover{background:var(--primary-soft)}
.tp[aria-pressed=true]{box-shadow:0 0 0 2px var(--primary);background:var(--primary-soft)}
.tp .th{height:120px;border-radius:6px;border:1px solid var(--border);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.tp .th .hb{height:14px;flex:none}
.tp .th .bd{flex:1;padding:6px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.tp .th .x{background:#e5e7eb;border-radius:3px}
.tp .th .r3{display:flex;gap:4px}.tp .th .r3 .x{flex:1;height:26px}
.tp .th .pl{height:12px;border-radius:5px;width:55%;align-self:center}
.tp .tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.tp .nm{font-weight:600;display:flex;gap:6px;align-items:center;justify-content:space-between}
.tp .ds{color:var(--muted);font-size:12px}
@media (max-width:699px){
  .tpls{grid-template-columns:1fr}
  .tp{flex-direction:row;align-items:center}.tp .th{width:84px;height:84px;flex:none}.tp .tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
}

/* منطقة العمل */
.work{display:grid;grid-template-columns:minmax(290px,330px) 1fr minmax(320px,370px);height:calc(100vh - var(--hdr));min-height:520px}
.navp,.insp{background:var(--surface);overflow:auto;min-width:0;display:flex;flex-direction:column}
.navp{border-inline-end:1px solid var(--border)}
.insp{border-inline-start:1px solid var(--border)}
.stage{overflow:auto;background:var(--background);display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;min-width:0}
.ptabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;gap:2px;position:sticky;top:0;background:var(--surface);z-index:5;flex:none}
.ptabs button{flex:1;border:0;background:none;padding:12px 6px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}
.pbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px}
.note.warn{border-color:color-mix(in srgb,var(--warning) 50%,transparent)}.note.warn svg{color:var(--warning)}
.note.prop{border-style:dashed}.note.neg svg{color:var(--negative)}
.coach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-inline-start:3px solid var(--primary);border-radius:var(--r);background:var(--primary-soft);width:100%;max-width:560px}
.coach p{margin:0;flex:1}

/* قائمة الأقسام */
.secs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);min-height:56px}
.row.sel{background:var(--primary-soft);border-inline-start:3px solid var(--primary)}
.row.hid .nm{color:var(--muted);text-decoration:line-through}
.row.drag{box-shadow:0 0 0 2px var(--primary)}
.grip{width:34px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--muted);touch-action:none;cursor:grab;border-radius:6px}
.grip:hover{background:var(--primary-soft)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:start;padding:4px 2px;min-height:44px}
.row .main .t{display:flex;flex-direction:column;min-width:0;gap:2px}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ty{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px dashed var(--field);border-radius:var(--r);background:none;color:var(--primary);font-weight:500;width:100%}
.add:hover{background:var(--primary-soft)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1px dashed var(--field);border-radius:var(--r)}
.pgrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);width:100%;text-align:start;min-height:52px}
.pgrow.sel{background:var(--primary-soft);border-inline-start:3px solid var(--primary)}.pgrow.prop{border-style:dashed}
.pgrow .t{flex:1;min-width:0;display:flex;flex-direction:column}.pgrow .t small{color:var(--muted)}

/* المفتش */
.ihead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5;flex:none}
.ihead .t{flex:1;min-width:0}.ihead .t small{display:block;color:var(--muted);font-size:12px}
.ihead .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iact{display:flex;gap:4px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fld .help{color:var(--muted);font-size:12px;margin:0}
.in,.sel-in,.ta{width:100%;min-height:40px;border:1px solid var(--field);border-radius:var(--r);background:var(--surface);padding:6px 10px}
.ta{min-height:84px;resize:vertical}
.in[disabled],.sel-in[disabled],.ta[disabled]{background:var(--background);color:var(--muted);cursor:not-allowed;border-style:dashed}
.in.ltr{direction:ltr;text-align:left}
.ro{padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--background);color:var(--muted)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r)}
.tgl .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--field);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw input:checked+i{background:var(--primary)}.sw input:checked+i::after{inset-inline-start:21px}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.sw input:disabled{cursor:not-allowed}.sw input:disabled+i{opacity:.45}
.swc{display:flex;gap:8px;flex-wrap:wrap}
.swc button{width:40px;height:40px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--field);display:flex;align-items:center;justify-content:center;color:#fff}
.swc button[aria-pressed=true]{box-shadow:0 0 0 2px var(--primary)}
.kv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:6px 10px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word;min-width:0}.kv dd.mono{display:block;text-align:left}.kv dd pre.json{max-width:100%}
.tabrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:var(--r)}
.tabrow .in,.tabrow .sel-in{min-height:36px}

/* المعاينة */
.stbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--field);background:var(--surface);font-weight:500}
.chip[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.chip.prop{border-style:dashed;color:var(--muted)}.chip.prop[aria-pressed=true]{color:var(--primary)}
.truth{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center;max-width:420px}
.phone{max-width:100%;border:10px solid #20242b;border-radius:34px;background:#20242b;position:relative;flex:none}
.phone::before{content:"";position:absolute;top:-6px;left:50%;width:70px;height:6px;margin-left:-35px;border-radius:0 0 6px 6px;background:#20242b}
.phone.tab{border-radius:20px}.phone.tab::before{display:none}
.screen{height:min(660px,calc(100vh - 330px));min-height:420px;border-radius:24px;overflow:auto;background:#fff;color:#15181d;position:relative}
.phone.tab .screen{border-radius:10px}
.stage.flat .phone{border:0;border-radius:0;background:none;width:100%!important}
.stage.flat .phone::before{display:none}
.stage.flat .screen{height:auto;min-height:420px;border:1px solid var(--border);border-radius:var(--r);overflow:visible}

/* التطبيق داخل المعاينة — لون التطبيق من اختيار التاجر لا لون هوية أَوْج */
.app{--ap:#0f6a5a;--ink:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;min-height:100%;background:#fff;color:#15181d}
.a-ann{background:#fef3c7;color:#78350f;padding:6px 12px;font-size:12px;display:flex;gap:8px;align-items:center;justify-content:center;border-bottom:1.5px dashed #b45309}
.a-bar{background:var(--ap);color:var(--ink);padding:14px 16px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.a-body{padding:22px 14px 14px;display:flex;flex-direction:column;gap:18px;flex:1}
.a-sec h3{margin:0 0 8px;font-size:16px}.a-sec p{margin:0;color:#4b5563}
.a-sec p.title{font-size:18px;font-weight:600;color:#15181d}.a-sec p.caption{font-size:12px}
.a-note{font-size:11px;color:#6b7280;margin-top:6px}
.a-prods{display:flex;gap:10px;overflow:hidden;padding-bottom:4px}
.a-pc{flex:none;width:132px;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff}
.a-pc .im{height:92px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;color:#9ca3af}
.a-pc .tx{padding:8px;font-size:13px}.a-pc .pr{font-family:var(--font-mono);font-size:12px;color:#374151;direction:ltr;text-align:start;margin-top:2px}
.a-img{aspect-ratio:16/9;border-radius:8px;background:#f1f3f5;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6b7280;gap:6px;overflow:hidden;font-size:12px}
.a-img img{width:100%;height:100%;object-fit:cover;display:block}
.a-btn{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;font-weight:600;background:var(--ap);color:var(--ink);border:0;width:100%}
.a-btn.sec{background:#fff;color:var(--ap);border:1.5px solid var(--ap)}
.a-card{border:1px solid #e5e7eb;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.a-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.a-q{display:inline-flex;align-items:center;border:1px solid #d1d5db;border-radius:6px;overflow:hidden}.a-q span{padding:2px 10px}
.a-prop{border:1.5px dashed #9ca3af;border-radius:8px;padding:10px;background:#f9fafb;display:flex;flex-direction:column;gap:6px}
.a-prop .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:#4b5563;flex-wrap:wrap}
.a-tabs{display:flex;border-top:1px solid #e5e7eb;background:#fff;position:sticky;bottom:0}
.a-tabs div{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:#6b7280;display:flex;flex-direction:column;align-items:center;gap:2px}.a-tabs div.on{color:var(--ap)}
.a-ghost{margin:10px 12px 0;padding:8px 10px;border:1.5px dashed #9ca3af;border-radius:8px;background:#f9fafb;font-size:12px;color:#4b5563}
.a-rib{font-size:10px;color:#6b7280;text-align:center;padding:2px;border-top:1px dashed #9ca3af;background:#f9fafb}
.a-addrow{display:flex;justify-content:center}
.a-add{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1.5px dashed #9ca3af;border-radius:8px;background:#fff;color:#374151;font-weight:500}
.a-add:hover{background:#f3f4f6}

/* التحديد داخل المعاينة */
.sx{position:relative;border-radius:6px;cursor:pointer;scroll-margin-top:150px}
.sx::after{content:"";position:absolute;inset:-5px;border:2px solid transparent;border-radius:9px;pointer-events:none}
.sx:hover::after{border-color:color-mix(in srgb,var(--primary) 45%,transparent)}
.sx.on::after{border-color:var(--primary)}
.sx:focus-visible{outline:none}.sx:focus-visible::after{border-color:var(--primary)}
.sx .lbl{display:none;position:absolute;top:-17px;inset-inline-start:2px;background:var(--primary);color:var(--primary-fg);font-size:11px;line-height:1.5;padding:0 8px;border-radius:4px;z-index:3;white-space:nowrap;pointer-events:none}
.sx:hover .lbl,.sx.on .lbl,.sx:focus-visible .lbl{display:inline-block}
.sx .ftb{position:absolute;top:-21px;inset-inline-end:0;display:flex;gap:1px;background:var(--surface);color:var(--text);border:1px solid var(--primary);border-radius:6px;padding:2px;z-index:4}
.sx .ftb button{width:32px;height:30px;border:0;background:none;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.sx .ftb button:hover{background:var(--primary-soft)}.sx .ftb button[disabled]{opacity:.35;cursor:not-allowed}
.sw-in{pointer-events:none}

/* معاينات الكتالوج */
.mv{height:76px;border-radius:6px;background:var(--background);border:1px solid var(--border);padding:8px;display:flex;gap:6px;align-items:stretch;overflow:hidden}
.mv .b{background:var(--border);border-radius:3px}.mv .bp{background:color-mix(in srgb,var(--primary) 55%,var(--border));border-radius:3px}
.mv .c{flex:1;display:flex;flex-direction:column;gap:4px}.mv.col{flex-direction:column}
.mv .rw{display:flex;gap:4px;align-items:center}.mv .ci{width:22px;height:22px;border-radius:50%;background:var(--border);flex:none}

/* حوارات وأوراق */
.ov{position:fixed;inset:0;background:rgba(14,16,20,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--text);width:100%;max-height:90vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.sheet:focus{outline:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}.sheet .sh h2{margin:0;font-size:16px;flex:1}
.sheet .sb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet .sf{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;padding:6px}
.menu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;background:none;border-radius:6px;text-align:start;font-weight:500}
.menu button:hover{background:var(--primary-soft)}.menu button.neg{color:var(--negative)}.menu button[disabled]{opacity:.45;cursor:not-allowed}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0;width:100%}
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ct{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);text-align:start;min-height:150px}
.ct:hover{background:var(--primary-soft)}.ct.prop{border-style:dashed}.ct.on{box-shadow:0 0 0 2px var(--primary)}
.ct .nm{font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}.ct .ds{color:var(--muted);font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.toasts{position:fixed;inset-inline:0;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);background:#15181d;color:#f3f4f6;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:540px}
html.dark .toast{background:#f3f4f6;color:#15181d}.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline}
.tree{display:flex;flex-direction:column;gap:2px;font-family:var(--font-mono);font-size:12px;direction:ltr}
.tree button{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:4px;min-height:32px}
.tree button:hover{background:var(--primary-soft)}.tree button.on{background:var(--primary-soft);outline:1px solid var(--primary)}
.tree .tid{color:var(--muted)}.tree .tw{color:var(--warning)}
pre.json{margin:0;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--background);overflow:auto;font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:left;max-height:62vh}
.crt{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 40px);padding:20px}
.crt .card{max-width:560px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.chk{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.chk li{display:flex;align-items:center;gap:10px}.chk li .st{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--positive)}
.bbar,.scrim{display:none}

/* 1000–1099: عمودان، المستكشف والمفتش يتناوبان (آيباد 10.2 الأفقي وما شابه) */
@media (min-width:1000px) and (max-width:1099px){
  .work{grid-template-columns:390px 1fr}
  .navp,.insp{grid-column:1;grid-row:1}
  .stage{grid-column:2;grid-row:1}
  .work[data-sel="1"] .navp{display:none}
  .work[data-sel="0"] .insp{display:none}
  .insp{border-inline-start:0;border-inline-end:1px solid var(--border)}
}
/* 1100 فما فوق: ثلاثة أعمدة (المستكشف + المعاينة + المفتش) — يشمل الآيباد الأفقي 11" و12.9" */
@media (min-width:1100px) and (max-width:1279px){.work{grid-template-columns:minmax(250px,290px) 1fr minmax(300px,340px)}}
@media (min-width:1000px){
  .sheet{width:min(720px,92vw);border-radius:14px;margin:auto;max-height:86vh}
  .ov{align-items:center}.cat{grid-template-columns:repeat(3,1fr)}
  .sheet.sm{width:min(420px,92vw)}
}
@media (min-width:1100px){.ihead .back{display:none}}

/* جوال وآيباد عمودي: المعاينة + أوراق سفلية */
@media (max-width:999px){
  :root{--hdr:0px}
  .top{padding:8px 12px;gap:6px}.top .ttl .badge,.top .seg-d,.hide-m{display:none!important}
  .modebar{display:block;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:25}
  .modebar .seg{display:flex;width:100%}.modebar .seg button{flex:1;min-height:40px}
  .status .long{display:none}.status .short{display:inline}
  .work{display:block;height:auto;min-height:calc(100vh - 160px)}
  .stage{overflow:visible;padding:12px 12px 52vh}
  .navp,.insp{display:none;position:fixed;inset-inline:0;bottom:56px;z-index:45;border:0;border-top:1px solid var(--border);border-radius:14px 14px 0 0;max-height:62vh}
  .navp.open,.insp.open{display:flex}
  .insp{max-height:46vh}
  .scrim.on{display:block;position:fixed;inset:0;bottom:56px;background:rgba(14,16,20,.35);z-index:40}
  .bbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .bbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 2px;min-height:56px;color:var(--muted);font-size:12px;font-weight:500}
  .bbar button[aria-pressed=true]{color:var(--primary)}
  .ptabs{position:static}.ihead{position:sticky}
  .toasts{bottom:72px}
}
/* آيباد عمودي (≥700 عرضاً و≥700 ارتفاعاً): المعاينة داخل إطار الجهاز وتبقى أدوات الجهاز والتراجع ظاهرة */
@media (min-width:700px) and (max-width:999px) and (min-height:700px){
  .top .btn.hide-m{display:inline-flex!important}
  .proto-strip .hide-m{display:inline!important}
  .status .long{display:inline}.status .short{display:none}
  .stage{padding-top:20px}
}

/* مؤشر المؤسّسة: أهداف لمس ≥ 44px على أجهزة اللمس فقط — سطح المكتب بالمؤشر الدقيق يبقى كثيفاً */
@media (pointer:coarse){
  .btn,.btn.sm{min-height:44px}.btn.ic{width:44px}
  .seg button,.chip{min-height:44px}
  .grip{width:44px}
  .in,.sel-in{min-height:44px}.tabrow .in,.tabrow .sel-in{min-height:44px}
  .sw{height:44px}.sw i{inset:9px 0}
  .swc button{width:44px;height:44px}
  .sx .ftb button{width:44px;height:44px}.sx .ftb{top:-30px}
  .tree button{min-height:44px}
  .a-add{min-height:44px}
  .link{padding:13px 6px;margin:-13px -6px}
  .toast button{min-height:44px;padding:0 8px}
  .status{min-height:44px}.modebar .seg button{min-height:44px}
  .tp{min-height:44px}
}
